name: Sentinel Fraud Intelligence CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-verify:
    name: Subsystem Quality & Syntax Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Common Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentinel-rag-investigator/requirements.txt scipy tabulate matplotlib pytest

      - name: Audit Subsystems Code Quality, Portfolio Hygiene & Privacy Guardrails
        run: |
          python verify_all_subsystems.py --audit

      - name: Execute Full Offline-Mock Verification Across All 8 Subsystems
        run: |
          python verify_all_subsystems.py --offline-mock

      - name: Run FastAPI RAG Assistant Unit Tests
        run: |
          pytest sentinel-rag-investigator/tests/ -v

