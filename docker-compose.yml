version: "3.9"

# ==============================================================================
# Project SENTINEL — Unified Polyglot Infrastructure Compose Specification
#
# Orchestrates all 4 specialized persistence engines + FastAPI RAG service:
#   1. MongoDB 7.0       (NoSQL High-Throughput Telemetry & Biometrics) : 27017
#   2. Neo4j 5.20        (Property Graph Mule Rings & Shared Hardware) : 7474, 7687
#   3. Qdrant 1.12       (3072-d Dense Vector Policy Retrieval)        : 6333, 6334
#   4. Sentinel RAG API  (FastAPI Polyglot Context Orchestrator)       : 8000
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   curl http://localhost:8000/health
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. NoSQL Behavioral & Device Telemetry Store (MongoDB 7.0 WiredTiger)
  # ----------------------------------------------------------------------------
  sentinel-mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sentinel_fraud_db
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5", "--bind_ip_all"]
    volumes:
      - sentinel_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Graph Fraud Ring & Shared Device Topology Engine (Neo4j 5.20 + APOC)
  # ----------------------------------------------------------------------------
  sentinel-neo4j:
    image: neo4j:5.20-community
    container_name: sentinel-fraud-graph
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser Web UI
      - "7687:7687"   # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_local_dev_only}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - sentinel_neo4j_data:/data
      - sentinel_neo4j_logs:/logs
      - sentinel_neo4j_import:/var/lib/neo4j/import
      - sentinel_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Dense Vector Regulatory & Policy Retrieval Engine (Qdrant 1.12 HNSW)
  # ----------------------------------------------------------------------------
  sentinel-qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: sentinel-qdrant-engine
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # High-Throughput gRPC Interface
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - sentinel_qdrant_data:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. FastAPI Polyglot RAG Investigator Assistant Service (POST /explain)
  # ----------------------------------------------------------------------------
  sentinel-rag-api:
    build:
      context: ./sentinel-rag-investigator
      dockerfile: Dockerfile
    container_name: sentinel-rag-investigator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_OFFLINE_MOCK=true
      - MONGODB_URI=mongodb://sentinel-mongodb:27017/sentinel_fraud_db
      - NEO4J_URI=bolt://sentinel-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_local_dev_only}
      - QDRANT_HOST=sentinel-qdrant
      - QDRANT_PORT=6333
    depends_on:
      sentinel-mongodb:
        condition: service_healthy
      sentinel-neo4j:
        condition: service_healthy
      sentinel-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sentinel_mongodb_data:
  sentinel_neo4j_data:
  sentinel_neo4j_logs:
  sentinel_neo4j_import:
  sentinel_neo4j_plugins:
  sentinel_qdrant_data:

