version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: sentinel-qdrant-engine
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web UI Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # High-Throughput gRPC Interface
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
