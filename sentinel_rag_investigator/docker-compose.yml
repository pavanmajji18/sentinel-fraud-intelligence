version: "3.9"

services:
  sentinel-rag-api:
    build: .
    container_name: sentinel-rag-investigator
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - SENTINEL_OFFLINE_MOCK=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      - qdrant
      - neo4j

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sentinel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  neo4j:
    image: neo4j:5-community
    container_name: sentinel-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sentinel_graph_2026
